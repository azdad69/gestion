<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="js.js" defer></script>
  </head>

  <body>
    <header>
      <div class="left">
        <img class="logo" src="photos/book.png" alt="book1" width="50" />
        <h1 class="logoo">Mes livres</h1>
      </div>
      <div class="bib">
        <img
          class="books"
          src="photos/home.png"
          alt="books"
          width="40"
          height="40"
        />
        <a class="livres" href="index.html">Accueil</a>
      </div>
    </header>
    <div class="recherche-tri">
        <input type="text" id="recherche" placeholder="Recherche par titre ou auteur...">
        <select id="tri">
            <option value="" hidden>Trie par...</option>
            <option value="titre">Titre</option>
            <option value="auteur">Auteur</option>
            <option value="annee">Année</option>
        </select>
    </div>
    
    <table>
    <thead>
        <tr>
            <th>Titre</th>
            <th>Auteur</th>
            <th>Genre</th>
            <th>Année</th>
            <th>Status</th>
            <th>Description</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="booksList"></tbody>
</table>
  </body>
</html>
